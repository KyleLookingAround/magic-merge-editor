name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: 'Personal PlanetPress program/template-editor'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Personal PlanetPress program/template-editor/package-lock.json'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 'Personal PlanetPress program/template-editor/playwright-report'
          retention-days: 7
